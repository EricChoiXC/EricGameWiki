SETTING:
  - KEY: "admin-org::change-password-expire-days"
    NAME: "密码有效期"
    DESC: "密码有效期，为 0 时表示不过期，过期时用户登录后强制进行修改密码，单位：天"
    DEFAULT: "0"
    TYPE: "integer"
  - KEY: "admin-org::password-min-length"
    NAME: "密码最小长度"
    DESC: "密码最小长度"
    DEFAULT: "6"
    TYPE: "integer"
  - KEY: "admin-org::password-not-equal-time"
    NAME: "密码不能相同"
    DESC: "密码不能相同，开启后用户不可设定与历史密码相同的密码"
    DEFAULT: "false"
    TYPE: "boolean"
  - KEY: "admin-org::lock-login-fail-times"
    NAME: "登录失败锁定次数"
    DESC: "登录失败锁定次数，为 0 时表示不锁定"
    DEFAULT: "5"
    TYPE: "integer"
  - KEY: "admin-org::default_password"
    NAME: "默认密码"
    DESC: "默认密码"
    DEFAULT: "123456"
    TYPE: "string"
